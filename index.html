    body: [
      `What makes the Jennifer Rauchet dress controversy worth analyzing is not the dress itself — a pale pink, off-the-shoulder gown with a silk sash and gunmetal brooch — but rather what it reveals about the semiotic function of fashion within political culture, and the specific vulnerabilities it exposes in movements whose identity is built on consumption as ideology. The gown drew little notice at the April 25 White House Correspondents' Dinner until online users claimed it matched a $13–$15 Temu listing, at which point side-by-side comparisons quickly spread across social media. No official confirmation was ever given, and the claims rested entirely on visual comparison. But the factual uncertainty is almost beside the point: the image of the comparison — plausible, spreadable, emotionally resonant — was enough to do its political work.`,
      `The reason it resonated so immediately is structural. Pete Hegseth, as Secretary of War, has publicly aligned with the Trump administration's "America First" agenda, which urges buying U.S.-made goods and reducing reliance on Chinese imports. The administration has not merely adopted this as policy preference; it has moralized it, framing consumer choices as expressions of national loyalty and sourcing from Chinese manufacturers as a kind of soft treason. When an ideology annexes personal consumption as its terrain, it necessarily exposes its adherents to a kind of accountability that more conventionally policy-focused political brands do not face. You cannot simultaneously declare that buying Chinese goods harms America and then be perceived — rightly or wrongly — to buy Chinese goods. The contradiction is not incidental. It is definitional.`,
      `Critics argued such choices weaken the credibility of the administration's economic stance, and coverage from multiple outlets linked the dress story to broader scrutiny of Hegseth's record, including the Pentagon's $93 billion September 2025 spending spree on luxury items — a juxtaposition that intensified the irony. This layering matters analytically. The dress controversy did not emerge in a vacuum; it arrived as one data point in an accumulating portrait of an administration whose rhetoric about austerity, national self-sufficiency, and anti-elitism coexists with lavish official expenditure and — now — the optics of alleged fast-fashion at a black-tie dinner. The dress became legible as scandal not because of what it was, but because of what it fit into.`,
      `Some observers drew comparisons to Melania Trump, who breaks tradition as first lady by rarely wearing American designers, suggesting that this particular contradiction is not individual but systemic — a recurring gap between the nationalist aesthetic the movement projects and the globalized supply chains its members actually navigate. That gap is not surprising. Domestic manufacturing in apparel has been decimated for decades, and truly buying American in fashion is expensive, difficult, and often more performative than substantive. The political problem is not the behavior; it is the rhetoric that made the behavior politically costly.`,
      `The public debate that followed split along lines that were superficially partisan but analytically more interesting than that. Online reactions ranged from mocking Rauchet's taste to defending her frugality, with supporters arguing that affordable fashion should not be stigmatized, while critics emphasized the political hypocrisy of sourcing from controversial foreign supply chains. The defense on "affordable fashion is fine" grounds was a category error — the charge was never about price. Nobody with standing in the critique was arguing that inexpensive clothing is shameful. The argument was ideological inconsistency: the specific tension between "America First" as a governing philosophy and "purchased from a Chinese fast-fashion platform" as a consumer behavior. Collapsing that targeted political argument into a strawman about class snobbery allowed defenders to appear reasonable while evading the actual substance entirely.`,
      `The deeper issue the episode surfaces is the fundamental instability of nationalism as a consumer ideology. Nationalism that demands its adherents perform economic patriotism through their purchasing choices is a nationalism that will always be exposed by the global economy it claims to resist. American apparel manufacturing cannot supply what Temu and Shein supply at those prices; the tariff regime the administration has imposed has made that gap, if anything, wider and more painful for ordinary consumers. The political movement that most aggressively moralizes consumption is also the political movement whose base is most dependent on the cheap Chinese imports it rhetorically condemns. This is not hypocrisy in the simple personal sense — it is a structural contradiction built into the ideology itself, one that a single viral dress comparison can suddenly make visible.`,
      `The debate also touched on broader concerns over fast fashion's labor practices and the selective application of political principles to personal life — a framing that gestures toward an even more uncomfortable truth, which is that the ethical problems with Temu and Shein go beyond national origin. Both platforms have faced sustained scrutiny over supply chain transparency, labor conditions, and links to forced labor practices. The "America First" critique of Rauchet's alleged gown is actually the weaker version of the critique available. The stronger version has nothing to do with national loyalty and everything to do with the working conditions of the people who made the dress — a critique that cuts across party lines and implicates consumer culture broadly. That the conversation largely stayed on the terrain of nationalism rather than labor ethics reveals something about the limits of how political fashion criticism circulates online. Viral traction requires simplicity and partisanship; a complex argument about supply chain ethics in global fast fashion does not travel as fast as a side-by-side image and the caption "America First, Made in China."`,
      `This points to a broader truth about the intersection of fashion and politics in contemporary public life: clothing at high-profile political events is never merely aesthetic. It is a text in a broader argument about who these people are, what they believe, and whether their stated values survive contact with their actual lives. The White House Correspondents' Dinner is particularly charged terrain for this kind of reading — a semi-theatrical event where Washington's political class dresses up and performs a version of itself for cameras, where every garment choice is already understood as a kind of statement. In that context, the gap between "America First" and "Made in China" does not require much interpretive effort to close. It announces itself.`,
      `What the episode ultimately demonstrates is that fashion functions as political semiotics most powerfully not when it is deliberate — the calculated Michelle Obama J. Crew appearance, the MAGA hat as tribal signal — but when it is unconsidered. Rauchet almost certainly did not intend her dress as a statement of any kind. That is precisely why it became one. Deliberate political fashion is managed and cushioned by intention; unconsidered fashion exposes the gap between what people perform in public and what they actually do in private. When a movement has made that gap its primary line of attack against its opponents, it becomes acutely vulnerable to the same exposure. The pale pink gown mattered not because it was from Temu — it may not have been — but because it was believable that it was, and it was believable because the contradiction it illustrated was already structurally true.`,
    ] },

// os/win.jsx — draggable Window, Taskbar, Clock, StartMenu
const { useState: useWS, useEffect: useWE, useRef: useWR, useCallback: useWC } = React;

let __Z = 20;

function Win({ id, title, x = 80, y = 80, width, accent, status, onClose, onMin, focusedId, onFocus, children }) {
  const [pos, setPos] = useWS({ x, y });
  const [z, setZ] = useWS(() => ++__Z);
  const drag = useWR(null);
  const active = focusedId === id;

  const bringFront = useWC(() => { setZ(++__Z); onFocus && onFocus(id); }, [id, onFocus]);

  function onDown(e) {
    if (e.target.closest(".win-x, .win-min")) return;
    bringFront();
    drag.current = { sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    e.preventDefault();
  }
  function onMove(e) {
    const d = drag.current; if (!d) return;
    setPos({ x: Math.max(-40, d.ox + (e.clientX - d.sx)), y: Math.max(0, d.oy + (e.clientY - d.sy)) });
  }
  function onUp() {
    drag.current = null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  }
  useWE(() => () => { window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); }, []);

  return (
    <div className="win bevel-out" style={{ left: pos.x, top: pos.y, zIndex: z, width }} onPointerDown={bringFront}>
      <div className={"win-title" + (active ? "" : " inactive")} onPointerDown={onDown}>
        <span className="win-name">{title}</span>
        <span className="win-btns">
          {onMin && <button className="win-min bevel-out" title="minimize" onClick={(e) => { e.stopPropagation(); onMin(id); }}>_</button>}
          {onClose && <button className="win-x bevel-out" title="close" onClick={(e) => { e.stopPropagation(); onClose(id); }}>X</button>}
        </span>
      </div>
      <div className="win-body bevel-in">{children}</div>
      {status && <div className="win-status">{status}</div>}
    </div>
  );
}

/* ===================== CLOCK ===================== */
function Clock({ frozen }) {
  const [now, setNow] = useWS(new Date());
  useWE(() => {
    if (frozen) return;
    const iv = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(iv);
  }, [frozen]);
  const d = frozen ? new Date(2010, 5, 11, 13, 0, 0) : now;
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const yy = d.getFullYear();
  let h = d.getHours(); const ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  const min = String(d.getMinutes()).padStart(2, "0");
  return (
    <div className="tb-clock bevel-in">
      <b>{mm}/{dd}/{yy}</b>
      <span>{h}:{min} {ampm}</span>
    </div>
  );
}

/* ===================== TASKBAR ===================== */
function Taskbar({ route, go, frozen, startOpen, setStartOpen, onPlus }) {
  const tabs = [
    ["home", "the tory tales"],
    ["essays", "posts"],
  ];
  return (
    <div className="taskbar">
      <button className="tb-start bevel-out" data-open={startOpen} onClick={() => setStartOpen((s) => !s)}>start</button>
      <div className="tb-tabs">
        {tabs.map(([id, label]) => (
          <button key={id} className="tb-tab bevel-out" data-on={route === id} onClick={() => go(id)}>{label}</button>
        ))}
        <button className="tb-plus bevel-out" title="new post" onClick={onPlus}>+</button>
      </div>
      <Clock frozen={frozen} />
    </div>
  );
}

/* ===================== START MENU ===================== */
function StartMenu({ open, close, go, openWin, onCompose }) {
  if (!open) return null;
  const item = (ic, label, fn) => (
    <div className="sm-item" onClick={() => { fn(); close(); }}><span className="ic">{ic}</span>{label}</div>
  );
  return (
    <React.Fragment>
      <div style={{ position: "fixed", inset: 0, zIndex: 9400 }} onClick={close} />
      <div className="startmenu bevel-out">
        <div className="sm-rail"><span>paperOS</span></div>
        <div className="sm-list">
          {item("\u25A4", "the tory tales", () => go("home"))}
          {item("\u2630", "all posts", () => go("essays"))}
          {item("\u270E", "new post", () => onCompose())}
          <div className="sm-sep" />
          {item("\u25C9", "socials", () => openWin("socials"))}
          {item("\u25D1", "set status", () => openWin("status"))}
          <div className="sm-sep" />
          {item("\u23FB", "log off (jk)", () => {})}
        </div>
      </div>
    </React.Fragment>
  );
}

Object.assign(window, { Win, Clock, Taskbar, StartMenu });

// os/widgets.jsx — window body contents + cursor trail + small presentational bits
const { useState: useGS, useEffect: useGE, useRef: useGR, useCallback: useGC } = React;

/* ===================== chiptune ===================== */
const MELODY = [
  [0,1],[4,1],[7,1],[12,1],[11,1],[7,1],[4,1],[2,1],
  [4,1],[7,1],[12,1],[16,1],[14,1],[12,1],[7,1],[4,1],
];
function useChiptune() {
  const ctxRef = useGR(null), timerRef = useGR(null), stepRef = useGR(0);
  const start = useGC(() => {
    if (!ctxRef.current) { const AC = window.AudioContext || window.webkitAudioContext; ctxRef.current = new AC(); }
    const ctx = ctxRef.current; if (ctx.state === "suspended") ctx.resume();
    const beat = 60 / 132; let next = ctx.currentTime + 0.05;
    function sch() {
      while (next < ctx.currentTime + 0.2) {
        const [semi, b] = MELODY[stepRef.current % MELODY.length];
        const f = 440 * Math.pow(2, semi / 12);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "square"; o.frequency.value = f; const dur = beat * b * 0.9;
        g.gain.setValueAtTime(0.0001, next); g.gain.exponentialRampToValueAtTime(0.05, next + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, next + dur);
        o.connect(g).connect(ctx.destination); o.start(next); o.stop(next + dur + 0.02);
        if (stepRef.current % 4 === 0) {
          const bo = ctx.createOscillator(), bg = ctx.createGain();
          bo.type = "triangle"; bo.frequency.value = f / 2;
          bg.gain.setValueAtTime(0.0001, next); bg.gain.exponentialRampToValueAtTime(0.045, next + 0.03);
          bg.gain.exponentialRampToValueAtTime(0.0001, next + beat * 0.9);
          bo.connect(bg).connect(ctx.destination); bo.start(next); bo.stop(next + beat);
        }
        next += beat * b; stepRef.current++;
      }
      timerRef.current = setTimeout(sch, 60);
    }
    sch();
  }, []);
  const stop = useGC(() => { clearTimeout(timerRef.current); timerRef.current = null;
    if (ctxRef.current && ctxRef.current.state === "running") ctxRef.current.suspend(); }, []);
  return { start, stop };
}

function NowPlayingBody() {
  const [playing, setPlaying] = useGS(false);
  const [track, setTrack] = useGS(0);
  const [pos, setPos] = useGS(0);
  const { start, stop } = useChiptune();
  const t = window.TRACKS[track];
  useGE(() => {
    if (!playing) return;
    const iv = setInterval(() => setPos((p) => {
      if (p + 1 >= t.len) { setTrack((tr) => (tr + 1) % window.TRACKS.length); return 0; }
      return p + 1;
    }), 1000);
    return () => clearInterval(iv);
  }, [playing, t.len]);
  function toggle() { if (playing) { stop(); setPlaying(false); } else { start(); setPlaying(true); } }
  const fmt = (s) => `${(s/60)|0}:${String(s%60).padStart(2,"0")}`;
  const pct = (pos / t.len) * 100;
  return (
    <div className="np">
      <div className="np-row">
        <div className="np-art" data-spin={playing}>{playing ? "\u266B" : "\u25C9"}</div>
        <div className="np-meta">
          <div className="np-title">{t.title}<span className="eq" data-on={playing}><i/><i/><i/><i/></span></div>
          <div className="np-artist">{t.artist}</div>
        </div>
      </div>
      <div className="np-bar bevel-in" onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setPos(Math.round((e.clientX-r.left)/r.width*t.len)); }}>
        <div className="np-fill" style={{ width: pct + "%" }} />
      </div>
      <div className="np-foot">
        <span className="np-time">{fmt(pos)} / {fmt(t.len)}</span>
        <span className="np-ctrls">
          <button className="bevel-out" onClick={() => { setTrack((track-1+window.TRACKS.length)%window.TRACKS.length); setPos(0); }}>{"\u23EE"}</button>
          <button className="play bevel-out" onClick={toggle}>{playing ? "\u23F8" : "\u25B6"}</button>
          <button className="bevel-out" onClick={() => { setTrack((track+1)%window.TRACKS.length); setPos(0); }}>{"\u23ED"}</button>
        </span>
      </div>
    </div>
  );
}

function SocialsBody() {
  const colors = { ig: "linear-gradient(135deg,#f9508a,#a73fd0)", sub: "#e2682f", letter: "#1f6fd0", pin: "#c8232c" };
  const letters = { ig: "ig", sub: "S", letter: "L", pin: "P" };
  return (
    <div>
      {window.SOCIALS.map((s, i) => (
        <a key={i} href={s.url} className="social-row" onClick={(e)=>e.preventDefault()} style={{ textDecoration: "none" }}>
          <span className="social-ic" style={{ background: colors[s.icon] }}>{letters[s.icon]}</span>
          <span className="social-label">{s.label}</span>
        </a>
      ))}
    </div>

/* ===================== cursor trail ===================== */
function Trail() {
  const ref = useGR(null), last = useGR(0);
  useGE(() => {
    function onMove(e) {
      const now = performance.now(); if (now - last.current < 60) return; last.current = now;
      const el = document.createElement("span");
      el.className = "trail-bit" + (Math.random() > 0.5 ? " alt" : "");
      el.style.left = e.clientX + "px"; el.style.top = e.clientY + "px";
      ref.current && ref.current.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }
    window.addEventListener("pointermove", onMove);
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return <div className="trail-layer" ref={ref} aria-hidden="true" />;
}

function NewPostForm({ onSave, onClose }) {
  const [title, setTitle] = useGS("");
  const [date, setDate] = useGS("");
  const [summary, setSummary] = useGS("");
  const [bodyText, setBodyText] = useGS("");
  const [tags, setTags] = useGS([]);
  const slug = (s) => (s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "post");
  function toggle(t) { setTags((ts) => ts.includes(t) ? ts.filter((x) => x !== t) : [...ts, t]); }
  function save() {
    if (!title.trim() || !bodyText.trim()) return;
    const paras = bodyText.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
    const words = bodyText.trim().split(/\s+/).length;
    const read = Math.max(1, Math.round(words / 200)) + " min";
    onSave({
      id: "user-" + Date.now(), user: true, title: title.trim(), date: date.trim(), read, cat: "",
      tags, file: slug(title) + ".txt", excerpt: summary.trim() || "(no summary)",
      body: paras.length ? paras : [bodyText.trim()],
    });
  }
  const can = title.trim() && bodyText.trim();
  return (
    <div className="compose">
      <label className="cf-label">title</label>
      <input className="cf-in bevel-in" value={title} maxLength={80} placeholder="my new post" onChange={(e) => setTitle(e.target.value)} />
      <label className="cf-label">date</label>
      <input className="cf-in bevel-in" value={date} maxLength={40} placeholder="e.g. june 10, 2026" onChange={(e) => setDate(e.target.value)} />
      <label className="cf-label">tags</label>
      <div className="cf-tags">
        {window.TAG_LIST.map((t) => {
          const d = window.TAGS[t]; const on = tags.includes(t);
          return <button key={t} type="button" className="tag-chip" style={on ? { color: "#fff", borderColor: d.c, background: d.c } : { color: d.c, borderColor: d.c, background: d.bg }} onClick={() => toggle(t)}>{t}</button>;
        })}
      </div>
      <label className="cf-label">one-line summary</label>
      <input className="cf-in bevel-in" value={summary} maxLength={160} placeholder="what's it about?" onChange={(e) => setSummary(e.target.value)} />
      <label className="cf-label">body <span className="cf-hint">— leave a blank line between paragraphs</span></label>
      <textarea className="cf-area bevel-in" value={bodyText} placeholder="start writing…" onChange={(e) => setBodyText(e.target.value)} />
      <div className="cf-btns">
        <button className="cf-cancel" type="button" onClick={onClose}>cancel</button>
        <button className="cf-save" type="button" disabled={!can} onClick={save}>publish ✦</button>
      </div>
    </div>
  );
}

// os/app.jsx — routing, window manager, tweaks
const { useState: useAS, useEffect: useAE } = React;

const PALETTES = {
  classic: { sw: ["#4682b4", "#3c3c42", "#f5f4ef"], v: { "--blue": "#4682b4", "--blue-lite": "#6fa6cf", "--purple": "#3c3c42", "--bg": "#f5f4ef" } },
  lilac:   { sw: ["#6a2bbf", "#c23f8f", "#f1edf4"], v: { "--blue": "#6a2bbf", "--blue-lite": "#9a5ce6", "--purple": "#c23f8f", "--bg": "#f1edf4" } },
  aqua:    { sw: ["#0a8ac4", "#1f9b8a", "#e7f1ee"], v: { "--blue": "#0a8ac4", "--blue-lite": "#3fd0e6", "--purple": "#1f9b8a", "--bg": "#e7f1ee" } },
  silver:  { sw: ["#46568c", "#6a6a8c", "#eceef2"], v: { "--blue": "#46568c", "--blue-lite": "#8a9ac4", "--purple": "#6a6a8c", "--bg": "#eceef2" } },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "classic",
  "crt": false,
  "frozen2003": true,
  "trail": true
}/*EDITMODE-END*/;

function applyPalette(name) {
  const p = PALETTES[name] || PALETTES.classic;
  Object.entries(p.v).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
}

// default window geometry (computed from viewport at open time)
function winDefault(id) {
  const W = window.innerWidth;
  const rightX = Math.max(640, W - 400);
  const midX = (560 + rightX) / 2;        // center of the gap between text col and right windows
  const cx = (dx) => Math.max(600, midX + dx);  // never cross into the text column
  const map = {
    meet:    { x: rightX, y: 40, w: undefined },
    reading: { x: Math.max(40, rightX - 90), y: 360, w: 360 },
    library:   { x: cx(-300), y: 90,  w: 360 },
    photobooth:{ x: cx(70),   y: 250, w: 300 },
    bluebells: { x: cx(-250), y: 470, w: 330 },
    swag:      { x: cx(140),  y: 640, w: 300 },
    socials: { x: Math.min(rightX + 60, W - 340), y: 430, w: 320 },
    np:      { x: rightX - 20, y: 470, w: 260 },
    gb:      { x: Math.max(620, W - 440), y: 120, w: 320 },
    status:  { x: rightX, y: 250, w: undefined },
    compose: { x: Math.max(40, (W - 400) / 2), y: 56, w: 380 },
  };
  return map[id] || { x: 200, y: 120 };
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useAS("home");
  const [open, setOpen] = useAS({ meet: true, reading: true, photobooth: true, library: true, swag: true, bluebells: true });  // utility windows
  const [docs, setDocs] = useAS([]);                          // open post windows
  const [status, setStatus] = useAS(0);
  const [focused, setFocused] = useAS("meet");
  const [startOpen, setStartOpen] = useAS(false);
  const [userPosts, setUserPosts] = useAS(() => {
    try { return JSON.parse(localStorage.getItem("paperos_user_posts") || "[]"); } catch (e) { return []; }
  });
  window.USER_POSTS = userPosts;

  useAE(() => { applyPalette(t.palette); }, [t.palette]);
  useAE(() => { document.body.setAttribute("data-crt", t.crt ? "1" : "0"); }, [t.crt]);

  // auto-arrange utility windows per page
  useAE(() => {
    if (route === "home") setOpen({ meet: true, reading: true, photobooth: true, library: true, swag: true, bluebells: true });
    else setOpen({});
    setDocs([]);
    window.scrollTo({ top: 0 });
  }, [route]);

  function go(r) { setRoute(r); setStartOpen(false); }
  function openWin(id) { setOpen((o) => ({ ...o, [id]: true })); setFocused(id); }
  function closeWin(id) { setOpen((o) => { const n = { ...o }; delete n[id]; return n; }); }
  function openPost(id) {
    setDocs((d) => {
      if (d.find((x) => x.id === id)) { setFocused("doc-" + id); return d; }
      const n = d.length;
      const base = winDefault("gb");
      return [...d, { id, x: 120 + n * 28, y: 90 + n * 26 }];
    });
    setFocused("doc-" + id);
  }
  function closeDoc(key) { setDocs((d) => d.filter((x) => "doc-" + x.id !== key)); }

  function persistUser(n) { try { localStorage.setItem("paperos_user_posts", JSON.stringify(n)); } catch (e) {} }
  function addPost(p) {
    const n = [...userPosts, p];
    setUserPosts(n); persistUser(n);
    setOpen((o) => { const x = { ...o }; delete x.compose; return x; });
    openPost(p.id);
  }
  function removePost(id) {
    const n = userPosts.filter((p) => p.id !== id);
    setUserPosts(n); persistUser(n);
    closeDoc("doc-" + id);
  }
  const openCompose = () => openWin("compose");

  const focusProps = { focusedId: focused, onFocus: setFocused };
  const postOf = (id) => [...window.POSTS, ...userPosts].find((p) => p.id === id);

  return (
    <React.Fragment>
      {t.trail && <window.Trail />}
      <window.Taskbar route={route} go={go} frozen={t.frozen2003} startOpen={startOpen} setStartOpen={setStartOpen} onPlus={openCompose} />
      <window.StartMenu open={startOpen} close={() => setStartOpen(false)} go={go} openWin={openWin} onCompose={openCompose} />

      <div className="desktop">
        {route === "home" && <window.HomeDesktop go={go} openPost={openPost} />}
        {route === "essays" && <window.EssaysPage openPost={openPost} openCompose={openCompose} />}

        {/* utility windows */}
        {open.meet && (
          <window.Win id="meet" title={`meet-${window.SITE.handle}`} {...winDefault("meet")}
            status={`${window.STATUS[status].label}`} onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.MeetBody />
          </window.Win>
        )}
        {open.reading && (
          <window.Win id="reading" title="baby-tory.jpg" {...winDefault("reading")} width={winDefault("reading").w}
            status="reading the paper since '10" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.ReadingBody />
          </window.Win>
        )}
        {open.library && (
          <window.Win id="library" title="littlewomen.jpg" {...winDefault("library")} width={winDefault("library").w}
            status="thrifting at the library ♡" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.PhotoBody src={window.IMG.library} alt="at the library with little women dvds" ratio="4 / 3" />
          </window.Win>
        )}
        {open.photobooth && (
          <window.Win id="photobooth" title="photobooth.png" {...winDefault("photobooth")} width={winDefault("photobooth").w}
            status="4 of 4 frames" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.PhotoBody src={window.IMG.photobooth} alt="photobooth strip with friends" ratio="4 / 3" />
          </window.Win>
        )}
        {open.swag && (
          <window.Win id="swag" title="s-w-a-g.jpg" {...winDefault("swag")} width={winDefault("swag").w}
            status="circa forever ago" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.PhotoBody src={window.IMG.swag} alt="swag hands" ratio="4 / 3" />
          </window.Win>
        )}
        {open.bluebells && (
          <window.Win id="bluebells" title="bluebells.jpg" {...winDefault("bluebells")} width={winDefault("bluebells").w}
            status="botanical garden, may" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.PhotoBody src={window.IMG.bluebells} alt="crouching in a field of bluebells" ratio="4 / 3" />
          </window.Win>
        )}
        {open.socials && (
          <window.Win id="socials" title="socials" {...winDefault("socials")} width={winDefault("socials").w}
            onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.SocialsBody />
          </window.Win>
        )}
        {open.status && (
          <window.Win id="status" title="set-status" {...winDefault("status")}
            onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.StatusBody status={status} setStatus={(i) => { setStatus(i); }} />
          </window.Win>
        )}

        {open.compose && (
          <window.Win id="compose" title="new-post.txt" {...winDefault("compose")} width={winDefault("compose").w}
            status="saved to this browser" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.NewPostForm onSave={addPost} onClose={() => closeWin("compose")} />
          </window.Win>
        )}

        {/* post document windows */}
        {docs.map((d) => (
          <window.Win key={d.id} id={"doc-" + d.id} title={(postOf(d.id) && postOf(d.id).file) || (d.id + ".txt")} x={d.x} y={d.y}
            width={Math.min(620, window.innerWidth * 0.86)} onClose={closeDoc} onMin={closeDoc} {...focusProps}>
            <window.PostDocBody post={postOf(d.id)} onDelete={removePost} />
          </window.Win>
        ))}
      </div>

      <div className="dock">
        <button className="dock-btn bevel-out" onClick={openCompose}><span className="d">+</span> new post</button>
        <button className="dock-btn bevel-out" onClick={() => openWin("socials")}><span className="d">◉</span> socials</button>
        <button className="dock-btn bevel-out" onClick={() => openWin("status")}><span className="d">●</span> status</button>
      </div>

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="OS palette" value={PALETTES[t.palette].sw}
          options={Object.keys(PALETTES).map((k) => PALETTES[k].sw)}
          onChange={(arr) => { const k = Object.keys(PALETTES).find((k) => PALETTES[k].sw.join() === arr.join()); if (k) setTweak("palette", k); }} />
        <TweakRadio label="(name)" value={t.palette} options={Object.keys(PALETTES)} onChange={(v) => setTweak("palette", v)} />
        <TweakSection label="Atmosphere" />
        <TweakToggle label="CRT scanlines" value={t.crt} onChange={(v) => setTweak("crt", v)} />
        <TweakToggle label="Frozen clock" value={t.frozen2003} onChange={(v) => setTweak("frozen2003", v)} />
        <TweakToggle label="Cursor trail" value={t.trail} onChange={(v) => setTweak("trail", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
