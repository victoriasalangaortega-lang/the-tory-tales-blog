  { id: "post6", title: "the pinterest girl doesn't exist", date: "may 21, 2026", read: "7 min", cat: "", tags: ["essay", "pop culture"], file: "pinterest-girl.txt",
    excerpt: "a lil essay on how pinterest turns identity into a product (ft. debord, bourdieu & butler)",
    body: [
      `Every few months a new Pinterest girl emerges. The old money girl. The coquette girl. The clean girl. The downtown girl. She arrives with a prescribed wardrobe, a collection of products, a color palette, and an entire lifestyle neatly organized into mood boards. Though these aesthetics present themselves as expressions of individuality, they are remarkably standardized. Thousands of women across different countries, classes, and backgrounds attempt to become the same handful of girls. The Pinterest girl presents herself as a pathway toward self-discovery, but perhaps what she actually represents is the transformation of identity into a consumer product.`,
      `The popularity of Pinterest aesthetics reflects a broader shift in the relationship between identity and image. Increasingly, individuals do not simply express who they are through aesthetics. Rather, aesthetics become the framework through which identity itself is understood. One is no longer merely a person who enjoys reading, dressing well, or drinking coffee. One becomes a “coquette girl,” a “clean girl,” or an “old money girl.” The aesthetic category comes first. The self follows afterward.`,
      `Guy Debord's concept of the spectacle provides a useful framework for understanding this phenomenon. In The Society of the Spectacle, Debord argues that social life becomes increasingly mediated by images. Direct lived experience is gradually replaced by representations of experience. Reality does not disappear entirely, but it becomes organized around appearances. The spectacle is not simply a collection of images. Rather, it is a social relationship mediated through images.`,
      `Pinterest aesthetics exemplify this process. Activities that once existed independently increasingly become aesthetic performances. Reading becomes less about reading and more about becoming the type of person who reads. Coffee becomes less about drinking coffee and more about performing a particular lifestyle. Travel becomes less about experiencing a location and more about producing photographs that resemble existing Pinterest boards. Everyday life is reorganized around its visual representation.`,
      `This shift can be observed through the popularity of aesthetics such as the old money girl. The old money aesthetic presents itself as an imitation of hereditary wealth and upper-class culture. Pinterest boards are filled with photographs of horses, tennis courts, European vacations, luxury watches, and Ralph Lauren sweaters. Yet most participants in the trend possess none of the economic conditions that produced these symbols. The aesthetic functions independently of actual wealth. The appearance of aristocratic status becomes more important than aristocratic status itself.`,
      `This is because the spectacle does not require reality. It only requires the appearance of reality.`,
      `The goal is not to become wealthy. The goal is to resemble the image of wealth.`,
      `Debord argues that modern capitalism increasingly prioritizes appearances over material reality. The old money aesthetic demonstrates this perfectly. Wealth is transformed into a visual language that can be purchased and performed through clothing, home decor, and social media content. Economic class becomes an aesthetic category available for consumption.`,
      `This observation aligns closely with Pierre Bourdieu's theory of cultural capital. Bourdieu argues that taste is never merely personal preference. Cultural preferences function as social signals that communicate status, education, and class position. What people wear, read, listen to, and consume helps establish their place within social hierarchies.`,
      `Pinterest aesthetics are saturated with cultural capital. Certain objects repeatedly appear across boards not because of their practical value but because of what they signify. Literary fiction, film cameras, vintage furniture, ballet flats, tote bags, matcha, and luxury fashion brands function as markers of distinction. They communicate refinement, education, creativity, or wealth. The object itself becomes secondary to the social meaning attached to it.`,
      `The popularity of the film camera provides a useful example. Film photography is often praised for its authenticity, nostalgia, and artistic quality. Yet for many users, the camera functions less as a photographic tool than as a cultural signifier. The possession of the camera communicates a particular identity. It signals artistic taste. The camera becomes valuable not only because of the photographs it produces but because of what it says about the person holding it.`,
      `Bourdieu's analysis reveals that Pinterest aesthetics are not simply fashion trends. They are systems through which social status is communicated and consumed. The old money girl accumulates signs of wealth. The clean girl accumulates signs of discipline and self-control. The downtown girl accumulates signs of artistic sophistication. Each aesthetic offers a collection of symbolic resources that users can deploy in the construction of identity.`,
      `Yet Pinterest aesthetics are not solely performances of class. They are also performances of gender.`,
      `This is where Judith Butler's theory of gender performativity becomes particularly useful. Butler argues that gender is not something individuals inherently possess. Rather, gender is produced through repeated acts, behaviors, gestures, and performances. What society recognizes as femininity emerges through continual repetition.`,
      `Pinterest functions as an enormous archive of feminine performances.`,
      `The coquette aesthetic, for example, relies heavily on bows, lace, soft colors, flirtation, and hyper-feminine imagery. The clean girl aesthetic emphasizes polished beauty, glowing skin, minimal makeup, and disciplined self-maintenance. Though these aesthetics appear radically different, they are both performances of femininity. Each offers a script through which womanhood can be enacted.`,
      `Importantly, these performances are often presented as natural expressions of personality. Yet Butler's theory reveals how constructed they truly are. There is nothing inherently feminine about a ribbon, a lip gloss, or a ballet flat. These objects become feminine through repetition and cultural association. Pinterest accelerates this process by endlessly circulating visual examples of how femininity should look.`,
      `The platform therefore functions as a repository of gendered instruction.`,
      `Users learn how to perform particular forms of womanhood by observing thousands of images that reinforce the same visual codes.`,
      `This process is especially significant because contemporary femininity increasingly operates through aesthetic categories rather than social roles. Previous generations often defined femininity through expectations surrounding marriage, motherhood, or domestic labor. Pinterest femininity is organized primarily through consumption and visual presentation. Femininity becomes less about what women do and more about how women appear.`,
      `The convergence of Debord, Bourdieu, and Butler reveals something important about Pinterest aesthetics. These trends are not simply harmless forms of self-expression. They represent a broader transformation in how identity operates under consumer capitalism.`,
      `The spectacle transforms life into images.`,
      `Cultural capital transforms identity into a collection of status symbols.`,
      `Gender performativity transforms womanhood into a series of repeatable aesthetic acts.`,
      `Pinterest exists at the intersection of all three processes.`,
      `The Pinterest girl appears unique, yet she is built from standardized visual codes. She appears authentic, yet her identity emerges from preexisting templates. She appears individual, yet millions of people attempt to become her simultaneously.`,
      `What Pinterest ultimately sells is not fashion, beauty, or lifestyle. It sells the promise that identity can be assembled through consumption. Every aesthetic presents itself as a pathway toward self-realization. Yet the self that emerges is often secondary to the image being pursued.`,
      `The Pinterest girl therefore occupies a peculiar position. She exists everywhere and nowhere at once. She appears across millions of boards, thousands of videos, and countless advertisements. Yet she is not a real woman. She is an ideal assembled from signs of class, signs of femininity, and signs of individuality. She functions less as a person than as a blueprint.`,
      `The tragedy of the Pinterest girl is that she promises self-discovery while encouraging self-replacement. The user is taught not to ask who she is, but which aesthetic she belongs to. Identity becomes something to be curated, optimized, and displayed. The image becomes more important than the individual producing it.`,
      `The Pinterest girl does not exist. What exists is an endless collection of images teaching women how they should.`,
    ] },
  { id: "post7", title: "the return of the doll", date: "january 6, 2026", read: "7 min", cat: "", tags: ["essay", "pop culture"], file: "return-of-the-doll.txt",
    excerpt: "after receiving at least five smiskis as gifts from my friends made me think about this whole trinket doll thing",
    body: [
      `Over the past decade dolls have increasingly re-entered popular culture in forms that extend far beyond childhood play. The popularity of collectible figures such as Labubus, Sonny Angels, Blythe dolls, and designer toys has created a market primarily sustained by adults rather than children. Simultaneously, nostalgia for dolls has become increasingly visible within fashion and online culture. The success of Barbie as both a commercial product and cultural phenomenon demonstrates that the doll continues to occupy a significant place within the contemporary imagination. At first glance this renewed interest may appear to be a simple expression of nostalgia. However, the return of the doll reflects broader transformations in the relationship between femininity, consumer culture, and identity.`,
      `The doll occupies a unique position among consumer objects because it exists in an ambiguous space between object and person. Unlike other toys, the doll resembles a human body. It possesses clothing, hair, facial features, and often an implied personality. Yet despite this resemblance to a person, the doll remains entirely passive. It can be dressed, modified, posed, collected, and displayed without resistance. The doll represents a version of personhood stripped of agency. Historically, dolls have functioned as tools through which ideas surrounding gender, beauty, and social behavior are communicated to children. They do not simply entertain. They teach. Through dolls, children learn how bodies should look, how clothing should function, and how femininity should be performed.`,
      `This educational function is particularly evident in the history of Barbie. Since her introduction in 1959, Barbie has operated less as a representation of ordinary women than as an idealized projection of femininity. Her significance lies not in her realism but in her artificiality. Barbie's body proportions, lifestyle, and appearance have always existed at a distance from lived reality. Yet this distance has not diminished her cultural influence. Rather, it is precisely because Barbie exists as an abstraction that she has proven so adaptable. The doll functions as a surface onto which fantasies of beauty, success, youth, and desirability can be projected.`,
      `The persistence of dolls within contemporary culture suggests that this logic has not disappeared with adulthood. Instead, it has expanded beyond the toy itself. Contemporary consumer culture increasingly encourages individuals to approach their own identities through practices of customization, curation, and aesthetic management. Social media platforms reward visual presentation. Fashion, beauty, and wellness industries promote the continual modification of the self. Identity increasingly appears not as something discovered but as something assembled.`,
      `Pierre Bourdieu's concept of cultural capital is useful in understanding this shift. Bourdieu argues that taste functions as a mechanism through which individuals communicate social position. Preferences in clothing, art, music, food, and consumption are often interpreted as expressions of individuality, but they simultaneously operate as markers of status. Collectible dolls increasingly participate within this economy of cultural capital. Ownership of particular dolls communicates membership within specific aesthetic communities. Limited-edition figures, designer toys, and carefully curated collections function similarly to luxury fashion or contemporary art. The doll becomes less significant as a toy than as a cultural object capable of communicating taste.`,
      `The growing popularity of figures such as Labubus illustrates this particularly well. Their appeal is not rooted in play but in display. They are photographed, styled, traded, and incorporated into online identities. Much like luxury accessories, they function as visual signifiers. Their value derives not only from the object itself but from what ownership communicates about the collector. The doll increasingly operates as an aesthetic commodity rather than a toy.`,
      `This relationship between aesthetics and identity becomes more significant when examined through the framework provided by Theory of the Young-Girl. The text argues that contemporary capitalism increasingly organizes subjectivity through consumption. The Young-Girl is not an actual girl but an ideal consumer identity defined by her relationship to commodities. Under this framework, femininity becomes inseparable from processes of self-modification. Beauty products, clothing, lifestyle trends, and wellness routines all promise access to an improved version of the self. Consumption is presented not merely as purchasing objects but as constructing identity.`,
      `The doll represents the perfect expression of this logic. A doll possesses no interiority. Its value is almost entirely aesthetic. It exists to be viewed, styled, and transformed. Contemporary beauty culture often reproduces these same principles. The body becomes a project requiring continual maintenance and improvement. New aesthetics emerge in rapid succession: the clean girl, the coquette girl, the old money girl, the Pilates girl. Each aesthetic offers a different set of visual codes through which femininity can be performed. While these identities appear distinct, they share a common structure. All present womanhood as something that can be assembled through consumption.`,
      `Judith Butler's theory of gender performativity further illuminates this process. Butler argues that gender is not an innate quality but something produced through repeated actions and behaviors. Femininity emerges through performance. The significance of dolls is that they provide highly simplified models of these performances. A doll does not possess femininity naturally. It becomes feminine through clothing, hairstyles, accessories, and visual presentation. Contemporary aesthetic culture increasingly treats women in a similar manner. Femininity is fragmented into a series of visual signifiers that can be adopted, removed, and recombined.`,
      `The rise of social media intensifies this relationship. Platforms such as Instagram and TikTok encourage individuals to transform themselves into curated visual objects. Photographs are edited, outfits are carefully selected, and daily activities are organized around their potential for representation. This process bears a striking resemblance to the treatment of dolls. Both are arranged for display. Both are valued according to appearance. Both function as surfaces upon which aesthetic meaning is projected.`,
      `This parallel becomes even more apparent when considering the relationship between dolls and influencers. Influencers increasingly operate as highly curated images rather than fully visible individuals. Their public personas are constructed through clothing, products, routines, and aesthetic consistency. Followers often engage with these personas primarily through visual representation. In this sense, the influencer occupies a position remarkably similar to the doll. Both exist as idealized figures whose value derives from their ability to embody desirable lifestyles and identities.`,
      `The return of the doll therefore reflects more than nostalgia for childhood. Rather, it reveals the growing importance of aesthetic self-construction within contemporary culture. Dolls persist because they embody a model of identity that has become increasingly familiar. They represent personhood reduced to appearance, customization, and display. As consumer culture continues to organize identity through visual presentation, the distinction between the doll and the individual becomes increasingly unstable.`,
      `Historically, dolls were used to prepare girls for adulthood. They provided miniature models through which social roles could be practiced and imagined. Today, however, adulthood itself increasingly resembles the logic of the doll. The emphasis on self-curation, aesthetic performance, and continual modification suggests that the doll has not remained confined to childhood. Instead, the principles that once governed the doll have expanded outward into broader culture. The contemporary fascination with dolls may therefore reveal less about childhood nostalgia than about the conditions of contemporary identity itself.`,
    ] },

// os/win.jsx — draggable Window, Taskbar, Clock, StartMenu
const { useState: useWS, useEffect: useWE, useRef: useWR, useCallback: useWC } = React;

let __Z = 20;

function Win({ id, title, x = 80, y = 80, width, accent, status, onClose, onMin, focusedId, onFocus, children }) {
  const [pos, setPos] = useWS({ x, y });
  const [z, setZ] = useWS(() => ++__Z);
  const drag = useWR(null);
  const active = focusedId === id;

  const bringFront = useWC(() => { setZ(++__Z); onFocus && onFocus(id); }, [id, onFocus]);

  function onDown(e) {
    if (e.target.closest(".win-x, .win-min")) return;
    bringFront();
    drag.current = { sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    e.preventDefault();
  }
  function onMove(e) {
    const d = drag.current; if (!d) return;
    setPos({ x: Math.max(-40, d.ox + (e.clientX - d.sx)), y: Math.max(0, d.oy + (e.clientY - d.sy)) });
  }
  function onUp() {
    drag.current = null;
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
  }
  useWE(() => () => { window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); }, []);

  return (
    <div className="win bevel-out" style={{ left: pos.x, top: pos.y, zIndex: z, width }} onPointerDown={bringFront}>
      <div className={"win-title" + (active ? "" : " inactive")} onPointerDown={onDown}>
        <span className="win-name">{title}</span>
        <span className="win-btns">
          {onMin && <button className="win-min bevel-out" title="minimize" onClick={(e) => { e.stopPropagation(); onMin(id); }}>_</button>}
          {onClose && <button className="win-x bevel-out" title="close" onClick={(e) => { e.stopPropagation(); onClose(id); }}>X</button>}
        </span>
      </div>
      <div className="win-body bevel-in">{children}</div>
      {status && <div className="win-status">{status}</div>}
    </div>
  );
}

/* ===================== CLOCK ===================== */
function Clock({ frozen }) {
  const [now, setNow] = useWS(new Date());
  useWE(() => {
    if (frozen) return;
    const iv = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(iv);
  }, [frozen]);
  const d = frozen ? new Date(2010, 5, 11, 13, 0, 0) : now;
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const yy = d.getFullYear();
  let h = d.getHours(); const ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  const min = String(d.getMinutes()).padStart(2, "0");
  return (
    <div className="tb-clock bevel-in">
      <b>{mm}/{dd}/{yy}</b>
      <span>{h}:{min} {ampm}</span>
    </div>
  );
}

/* ===================== TASKBAR ===================== */
function Taskbar({ route, go, frozen, startOpen, setStartOpen, onPlus }) {
  const tabs = [
    ["home", "the tory tales"],
    ["essays", "posts"],
  ];
  return (
    <div className="taskbar">
      <button className="tb-start bevel-out" data-open={startOpen} onClick={() => setStartOpen((s) => !s)}>start</button>
      <div className="tb-tabs">
        {tabs.map(([id, label]) => (
          <button key={id} className="tb-tab bevel-out" data-on={route === id} onClick={() => go(id)}>{label}</button>
        ))}
        <button className="tb-plus bevel-out" title="new post" onClick={onPlus}>+</button>
      </div>
      <Clock frozen={frozen} />
    </div>
  );
}

/* ===================== START MENU ===================== */
function StartMenu({ open, close, go, openWin, onCompose }) {
  if (!open) return null;
  const item = (ic, label, fn) => (
    <div className="sm-item" onClick={() => { fn(); close(); }}><span className="ic">{ic}</span>{label}</div>
  );
  return (
    <React.Fragment>
      <div style={{ position: "fixed", inset: 0, zIndex: 9400 }} onClick={close} />
      <div className="startmenu bevel-out">
        <div className="sm-rail"><span>paperOS</span></div>
        <div className="sm-list">
          {item("\u25A4", "the tory tales", () => go("home"))}
          {item("\u2630", "all posts", () => go("essays"))}
          {item("\u270E", "new post", () => onCompose())}
          <div className="sm-sep" />
          {item("\u25C9", "socials", () => openWin("socials"))}
          {item("\u25D1", "set status", () => openWin("status"))}
          <div className="sm-sep" />
          {item("\u23FB", "log off (jk)", () => {})}
        </div>
      </div>
    </React.Fragment>
  );
}

Object.assign(window, { Win, Clock, Taskbar, StartMenu });

const { useState: useGS, useEffect: useGE, useRef: useGR, useCallback: useGC } = React;

/* ===================== chiptune ===================== */
const MELODY = [
  [0,1],[4,1],[7,1],[12,1],[11,1],[7,1],[4,1],[2,1],
  [4,1],[7,1],[12,1],[16,1],[14,1],[12,1],[7,1],[4,1],
];
function useChiptune() {
  const ctxRef = useGR(null), timerRef = useGR(null), stepRef = useGR(0);
  const start = useGC(() => {
    if (!ctxRef.current) { const AC = window.AudioContext || window.webkitAudioContext; ctxRef.current = new AC(); }
    const ctx = ctxRef.current; if (ctx.state === "suspended") ctx.resume();
    const beat = 60 / 132; let next = ctx.currentTime + 0.05;
    function sch() {
      while (next < ctx.currentTime + 0.2) {
        const [semi, b] = MELODY[stepRef.current % MELODY.length];
        const f = 440 * Math.pow(2, semi / 12);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "square"; o.frequency.value = f; const dur = beat * b * 0.9;
        g.gain.setValueAtTime(0.0001, next); g.gain.exponentialRampToValueAtTime(0.05, next + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, next + dur);
        o.connect(g).connect(ctx.destination); o.start(next); o.stop(next + dur + 0.02);
        if (stepRef.current % 4 === 0) {
          const bo = ctx.createOscillator(), bg = ctx.createGain();
          bo.type = "triangle"; bo.frequency.value = f / 2;
          bg.gain.setValueAtTime(0.0001, next); bg.gain.exponentialRampToValueAtTime(0.045, next + 0.03);
          bg.gain.exponentialRampToValueAtTime(0.0001, next + beat * 0.9);
          bo.connect(bg).connect(ctx.destination); bo.start(next); bo.stop(next + beat);
        }
        next += beat * b; stepRef.current++;
      }
      timerRef.current = setTimeout(sch, 60);
    }
    sch();
  }, []);
  const stop = useGC(() => { clearTimeout(timerRef.current); timerRef.current = null;
    if (ctxRef.current && ctxRef.current.state === "running") ctxRef.current.suspend(); }, []);
  return { start, stop };
}

function NowPlayingBody() {
  const [playing, setPlaying] = useGS(false);
  const [track, setTrack] = useGS(0);
  const [pos, setPos] = useGS(0);
  const { start, stop } = useChiptune();
  const t = window.TRACKS[track];
  useGE(() => {
    if (!playing) return;
    const iv = setInterval(() => setPos((p) => {
      if (p + 1 >= t.len) { setTrack((tr) => (tr + 1) % window.TRACKS.length); return 0; }
      return p + 1;
    }), 1000);
    return () => clearInterval(iv);
  }, [playing, t.len]);
  function toggle() { if (playing) { stop(); setPlaying(false); } else { start(); setPlaying(true); } }
  const fmt = (s) => `${(s/60)|0}:${String(s%60).padStart(2,"0")}`;
  const pct = (pos / t.len) * 100;
  return (
    <div className="np">
      <div className="np-row">
        <div className="np-art" data-spin={playing}>{playing ? "\u266B" : "\u25C9"}</div>
        <div className="np-meta">
          <div className="np-title">{t.title}<span className="eq" data-on={playing}><i/><i/><i/><i/></span></div>
          <div className="np-artist">{t.artist}</div>
        </div>
      </div>
      <div className="np-bar bevel-in" onClick={(e) => { const r = e.currentTarget.getBoundingClientRect(); setPos(Math.round((e.clientX-r.left)/r.width*t.len)); }}>
        <div className="np-fill" style={{ width: pct + "%" }} />
      </div>
      <div className="np-foot">
        <span className="np-time">{fmt(pos)} / {fmt(t.len)}</span>
        <span className="np-ctrls">
          <button className="bevel-out" onClick={() => { setTrack((track-1+window.TRACKS.length)%window.TRACKS.length); setPos(0); }}>{"\u23EE"}</button>
          <button className="play bevel-out" onClick={toggle}>{playing ? "\u23F8" : "\u25B6"}</button>
          <button className="bevel-out" onClick={() => { setTrack((track+1)%window.TRACKS.length); setPos(0); }}>{"\u23ED"}</button>
        </span>
      </div>
    </div>
  );
}

function MeetBody() {

function GuestbookBody() {
  const [entries, setEntries] = useGS(window.GUESTBOOK_SEED);
  const [name, setName] = useGS("");
  const [msg, setMsg] = useGS("");
  function sign(e) {
    e.preventDefault(); if (!msg.trim()) return;
    const d = new Date(); const at = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    setEntries([{ name: (name.trim()||"an0n"), msg: msg.trim(), at }, ...entries]);
    setName(""); setMsg("");
  }
  return (
    <div className="gb">
      <div className="gb-list">
        {entries.map((en, i) => (
          <div key={i} className="gb-entry">
            <span className="gb-time">{en.at}</span>
            <span className="gb-from">{en.name} &gt;</span>{" "}
            <span className="gb-text">{en.msg}</span>
          </div>
        ))}
      </div>
      <form className="gb-form" onSubmit={sign}>
        <div className="row">
          <input className="name bevel-in" placeholder="ur name" maxLength={16} value={name} onChange={(e)=>setName(e.target.value)} />
          <input className="msg bevel-in" placeholder="leave a note..." maxLength={120} value={msg} onChange={(e)=>setMsg(e.target.value)} />
        </div>
        <button className="gb-send" type="submit">SIGN</button>
      </form>
    </div>
  );
}

function StatusBody({ status, setStatus }) {
  return (
    <div style={{ width: 220 }}>
      <div className="st-now">{window.STATUS[status].emoji} {window.STATUS[status].label}</div>
      <div className="st-opts">
        {window.STATUS.map((s, i) => (
          <div key={i} className="st-opt" data-on={status===i} onClick={() => setStatus(i)}>
            <span className="dot">{s.emoji}</span> {s.label}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ===================== presentational ===================== */
function TopicBadges({ onPick }) {
  return (
    <div className="badges">
      {window.TOPICS.map((t) => (
        <div key={t.id} className="badge" onClick={() => onPick && onPick(t)} style={{ cursor: onPick ? "pointer" : "default" }}>
          <div className="badge-ring" style={{ background: `conic-gradient(from 180deg, ${t.g[0]}, ${t.g[1]}, ${t.g[0]})` }}>
            <div className="badge-core">{t.mono}</div>
          </div>
          <div className="badge-label">{t.label}</div>
        </div>
      ))}
    </div>
  );
}

function Shelf() {
  return (
    <div>
      {window.SHELF.map((s, i) => (
        <div key={i} className="shelf-row">
          <div className="shelf-year">{s.year}</div>
          <div className="shelf-title">{s.title}</div>
          <div className="shelf-sub">{s.sub}</div>
        </div>
      ))}
    </div>
  );
}

/* ===================== cursor trail ===================== */
function Trail() {
  const ref = useGR(null), last = useGR(0);
  useGE(() => {
    function onMove(e) {
      const now = performance.now(); if (now - last.current < 60) return; last.current = now;
      const el = document.createElement("span");
      el.className = "trail-bit" + (Math.random() > 0.5 ? " alt" : "");
      el.style.left = e.clientX + "px"; el.style.top = e.clientY + "px";
      ref.current && ref.current.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }
    window.addEventListener("pointermove", onMove);
    return () => window.removeEventListener("pointermove", onMove);
  }, []);
  return <div className="trail-layer" ref={ref} aria-hidden="true" />;
}

function Tags({ list }) {
  if (!list || !list.length) return null;
  return (
    <span className="tag-row">

}

function NewPostForm({ onSave, onClose }) {
  const [title, setTitle] = useGS("");
  const [date, setDate] = useGS("");
  const [summary, setSummary] = useGS("");
  const [bodyText, setBodyText] = useGS("");
  const [tags, setTags] = useGS([]);
  const slug = (s) => (s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "post");
  function toggle(t) { setTags((ts) => ts.includes(t) ? ts.filter((x) => x !== t) : [...ts, t]); }
  function save() {
    if (!title.trim() || !bodyText.trim()) return;
    const paras = bodyText.split(/\n\s*\n/).map((s) => s.trim()).filter(Boolean);
    const words = bodyText.trim().split(/\s+/).length;
    const read = Math.max(1, Math.round(words / 200)) + " min";
    onSave({
      id: "user-" + Date.now(), user: true, title: title.trim(), date: date.trim(), read, cat: "",
      tags, file: slug(title) + ".txt", excerpt: summary.trim() || "(no summary)",
      body: paras.length ? paras : [bodyText.trim()],
    });
  }
  const can = title.trim() && bodyText.trim();
  return (
    <div className="compose">
      <label className="cf-label">title</label>
      <input className="cf-in bevel-in" value={title} maxLength={80} placeholder="my new post" onChange={(e) => setTitle(e.target.value)} />
      <label className="cf-label">date</label>
      <input className="cf-in bevel-in" value={date} maxLength={40} placeholder="e.g. june 10, 2026" onChange={(e) => setDate(e.target.value)} />
      <label className="cf-label">tags</label>
      <div className="cf-tags">
        {window.TAG_LIST.map((t) => {
          const d = window.TAGS[t]; const on = tags.includes(t);
          return <button key={t} type="button" className="tag-chip" style={on ? { color: "#fff", borderColor: d.c, background: d.c } : { color: d.c, borderColor: d.c, background: d.bg }} onClick={() => toggle(t)}>{t}</button>;
        })}
      </div>
      <label className="cf-label">one-line summary</label>
      <input className="cf-in bevel-in" value={summary} maxLength={160} placeholder="what's it about?" onChange={(e) => setSummary(e.target.value)} />
      <label className="cf-label">body <span className="cf-hint">— leave a blank line between paragraphs</span></label>
      <textarea className="cf-area bevel-in" value={bodyText} placeholder="start writing…" onChange={(e) => setBodyText(e.target.value)} />
      <div className="cf-btns">
        <button className="cf-cancel" type="button" onClick={onClose}>cancel</button>
        <button className="cf-save" type="button" disabled={!can} onClick={save}>publish ✦</button>
      </div>
    </div>
  );
}

// os/app.jsx — routing, window manager, tweaks
const { useState: useAS, useEffect: useAE } = React;

const PALETTES = {
  classic: { sw: ["#4682b4", "#3c3c42", "#f5f4ef"], v: { "--blue": "#4682b4", "--blue-lite": "#6fa6cf", "--purple": "#3c3c42", "--bg": "#f5f4ef" } },
  lilac:   { sw: ["#6a2bbf", "#c23f8f", "#f1edf4"], v: { "--blue": "#6a2bbf", "--blue-lite": "#9a5ce6", "--purple": "#c23f8f", "--bg": "#f1edf4" } },
  aqua:    { sw: ["#0a8ac4", "#1f9b8a", "#e7f1ee"], v: { "--blue": "#0a8ac4", "--blue-lite": "#3fd0e6", "--purple": "#1f9b8a", "--bg": "#e7f1ee" } },
  silver:  { sw: ["#46568c", "#6a6a8c", "#eceef2"], v: { "--blue": "#46568c", "--blue-lite": "#8a9ac4", "--purple": "#6a6a8c", "--bg": "#eceef2" } },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "classic",
  "crt": false,
  "frozen2003": true,
  "trail": true
}/*EDITMODE-END*/;

function applyPalette(name) {
  const p = PALETTES[name] || PALETTES.classic;
  Object.entries(p.v).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
}

// default window geometry (computed from viewport at open time)
function winDefault(id) {
  const W = window.innerWidth;
  const rightX = Math.max(640, W - 400);
  const map = {
    meet:    { x: rightX, y: 40, w: undefined },
    socials: { x: Math.min(rightX + 60, W - 340), y: 430, w: 320 },
    np:      { x: rightX - 20, y: 470, w: 260 },
    gb:      { x: Math.max(620, W - 440), y: 120, w: 320 },
    status:  { x: rightX, y: 250, w: undefined },
    compose: { x: Math.max(40, (W - 400) / 2), y: 56, w: 380 },
  };
  return map[id] || { x: 200, y: 120 };
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useAS("home");
  const [open, setOpen] = useAS({ meet: true, socials: true });  // utility windows
  const [docs, setDocs] = useAS([]);                          // open post windows
  const [status, setStatus] = useAS(0);
  const [focused, setFocused] = useAS("meet");
  const [startOpen, setStartOpen] = useAS(false);
  const [userPosts, setUserPosts] = useAS(() => {
    try { return JSON.parse(localStorage.getItem("paperos_user_posts") || "[]"); } catch (e) { return []; }
  });
  window.USER_POSTS = userPosts;

  useAE(() => { applyPalette(t.palette); }, [t.palette]);
  useAE(() => { document.body.setAttribute("data-crt", t.crt ? "1" : "0"); }, [t.crt]);

  // auto-arrange utility windows per page
  useAE(() => {
    if (route === "home") setOpen({ meet: true, socials: true });
    else setOpen({});
    setDocs([]);
    window.scrollTo({ top: 0 });
  }, [route]);

  function go(r) { setRoute(r); setStartOpen(false); }
  function openWin(id) { setOpen((o) => ({ ...o, [id]: true })); setFocused(id); }
  function closeWin(id) { setOpen((o) => { const n = { ...o }; delete n[id]; return n; }); }
  function openPost(id) {
    setDocs((d) => {
      if (d.find((x) => x.id === id)) { setFocused("doc-" + id); return d; }
      const n = d.length;
      const base = winDefault("gb");
      return [...d, { id, x: 120 + n * 28, y: 90 + n * 26 }];
    });
    setFocused("doc-" + id);
  }
  function closeDoc(key) { setDocs((d) => d.filter((x) => "doc-" + x.id !== key)); }

  function persistUser(n) { try { localStorage.setItem("paperos_user_posts", JSON.stringify(n)); } catch (e) {} }
  function addPost(p) {
    const n = [...userPosts, p];
    setUserPosts(n); persistUser(n);
    setOpen((o) => { const x = { ...o }; delete x.compose; return x; });
    openPost(p.id);
  }
  function removePost(id) {
    const n = userPosts.filter((p) => p.id !== id);
    setUserPosts(n); persistUser(n);
    closeDoc("doc-" + id);
  }
  const openCompose = () => openWin("compose");

  const focusProps = { focusedId: focused, onFocus: setFocused };
  const postOf = (id) => [...window.POSTS, ...userPosts].find((p) => p.id === id);

  return (
    <React.Fragment>
      {t.trail && <window.Trail />}
      <window.Taskbar route={route} go={go} frozen={t.frozen2003} startOpen={startOpen} setStartOpen={setStartOpen} onPlus={openCompose} />
      <window.StartMenu open={startOpen} close={() => setStartOpen(false)} go={go} openWin={openWin} onCompose={openCompose} />

      <div className="desktop">
        {route === "home" && <window.HomeDesktop go={go} openPost={openPost} />}
        {route === "essays" && <window.EssaysPage openPost={openPost} openCompose={openCompose} />}

        {/* utility windows */}
        {open.meet && (
          <window.Win id="meet" title={`meet-${window.SITE.handle}`} {...winDefault("meet")}
            status={`${window.STATUS[status].label}`} onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.MeetBody />
          </window.Win>
        )}
        {open.socials && (
          <window.Win id="socials" title="socials" {...winDefault("socials")} width={winDefault("socials").w}
            onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.SocialsBody />
          </window.Win>
        )}
        {open.status && (
          <window.Win id="status" title="set-status" {...winDefault("status")}
            onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.StatusBody status={status} setStatus={(i) => { setStatus(i); }} />
          </window.Win>
        )}

        {open.compose && (
          <window.Win id="compose" title="new-post.txt" {...winDefault("compose")} width={winDefault("compose").w}
            status="saved to this browser" onClose={closeWin} onMin={closeWin} {...focusProps}>
            <window.NewPostForm onSave={addPost} onClose={() => closeWin("compose")} />
          </window.Win>
        )}

        {/* post document windows */}
        {docs.map((d) => (
          <window.Win key={d.id} id={"doc-" + d.id} title={(postOf(d.id) && postOf(d.id).file) || (d.id + ".txt")} x={d.x} y={d.y}
            width={Math.min(620, window.innerWidth * 0.86)} onClose={closeDoc} onMin={closeDoc} {...focusProps}>
            <window.PostDocBody post={postOf(d.id)} onDelete={removePost} />
          </window.Win>
        ))}
      </div>

      <div className="dock">
        <button className="dock-btn bevel-out" onClick={openCompose}><span className="d">+</span> new post</button>
        <button className="dock-btn bevel-out" onClick={() => openWin("socials")}><span className="d">◉</span> socials</button>
        <button className="dock-btn bevel-out" onClick={() => openWin("status")}><span className="d">●</span> status</button>
      </div>

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakColor label="OS palette" value={PALETTES[t.palette].sw}
          options={Object.keys(PALETTES).map((k) => PALETTES[k].sw)}
          onChange={(arr) => { const k = Object.keys(PALETTES).find((k) => PALETTES[k].sw.join() === arr.join()); if (k) setTweak("palette", k); }} />
        <TweakRadio label="(name)" value={t.palette} options={Object.keys(PALETTES)} onChange={(v) => setTweak("palette", v)} />
        <TweakSection label="Atmosphere" />
        <TweakToggle label="CRT scanlines" value={t.crt} onChange={(v) => setTweak("crt", v)} />
        <TweakToggle label="Frozen clock" value={t.frozen2003} onChange={(v) => setTweak("frozen2003", v)} />
        <TweakToggle label="Cursor trail" value={t.trail} onChange={(v) => setTweak("trail", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);


  </script>
</body>
